name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: mongodb+srv://supercluster.d83jj.mongodb.net/superData
  MONGO_USERNAME: superuser
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        container:
          image: node:20
          options: --user root
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        # - name: Setup NodeJS Version
        #   uses: actions/setup-node@v4
        #   with:
        #     node-version: 20

        - name: Cache NPM dependencies
          uses: actions/cache@v2
          with:
            key: ${{ runner.os }}-node-${{ hashFiles('./package-lock.json') }}
            path: ~/.npm
    
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result
            path: test-results.xml

    code-coverage:
      runs-on: ubuntu-latest

      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup NodeJS Version
        uses: actions/setup-node@v4
        with:
          node-version: 18
      
      - name: Install Dependencies
        run: npm install

      - name: Run Code Coverage Command
        run: npm run coverage
        continue-on-error: true

      - name: Archive Code Coverage Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Code-Coverage-Result
          path: coverage
          retention-days: 5

    docker:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        
        - name: Log into GitHub Container Registry
          uses: docker/login-action@v2
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build Docker Image
          uses: docker/build-push-action@v2
          with:
            context: .
            file: ./Dockerfile
            push: true
            tags: ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}

    dev-deploy:
      runs-on: ubuntu-latest
      needs: [docker]
      environment: 
        name: development
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup kubectl
          uses: azure/setup-kubectl@v1
          with:
            version: 'v1.26.0'

        - name: Set kubectl context
          uses: azure/k8s-set-context@v1
          with:
            kubeconfig: ${{ secrets.KUBECONFIG }}
        
        # - name: Verify kubectl setup
        #   run: kubectl version --short -o yaml

        - name: Fetch the NGINX INGRESS CONTROLLER IP Address and save it as a GitHub Environment Variable
          run: echo 'INGRESS_IP=$(kubectl -n ingress-nginx get services ingress-nginx-controller -o jsonpath="{.status.loadBalancer.ingress[0].ip}")' >> $GITHUB_ENV

        - name: Replace Placeholders
          uses: cschleiden/replace-tokens@v1
          with:
            files: 'kubernetes/${{ vars.NAMESPACE }}/*.yaml'
            tokenPrefix: '_{_'
            tokenSuffix: '_}_'
          env:
            INGRESS_IP: ${{ env.INGRESS_IP }}
            NAMESPACE: ${{ vars.NAMESPACE }}
            REPLICAS: ${{ vars.REPLICAS }}
            IMAGE: ${{ github.repository_owner }}/solar-system:${{ github.sha }}
